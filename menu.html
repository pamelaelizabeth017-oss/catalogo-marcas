<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Menú</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    background: linear-gradient(180deg, #16324F, #1F4E68);
    font-family: Arial, Helvetica, sans-serif;

    padding: 20px 15px 30px 15px;

    /* FRANJA DORADA */
    border-bottom: 4px solid #D9B44A;
}


/* TÍTULO */
h2 {
    color: #ffffff;

    font-size: 17px;
    font-weight: 600;

    letter-spacing: 2px;

    margin: 0 0 18px 5px;
}


/* CUADRITOS */
.categoria {

    display: block;

    width: 100%;

    background-color: rgba(255,255,255,0.95);

    color: #16324F;

    text-decoration: none;

    padding: 13px 14px;

    margin-bottom: 9px;

    border: 1px solid rgba(255,255,255,0.40);

    border-radius: 8px;

    font-size: 13px;

    font-weight: 600;

    transition: all 0.25s ease;
}


/* PUNTO DORADO */
.categoria::before {

    content: "•";

    color: #D9B44A;

    margin-right: 9px;

    font-size: 16px;
}


/* AL PASAR EL MOUSE */
.categoria:hover {

    background-color: #D9B44A;

    color: #16324F;

    border-color: #D9B44A;

    transform: translateX(5px);

    box-shadow: 0px 5px 14px rgba(0,0,0,0.20);
}


/* PUNTO AL PASAR MOUSE */
.categoria:hover::before {
    color: #16324F;
}


/* AL HACER CLICK */
.categoria:active {
    transform: translateX(5px) scale(0.97);
}

</style>

</head>
